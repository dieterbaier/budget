# Validate a pull request before it is rebased onto main.
#
# The repository holds three independently built things — the architecture
# documentation, the Spring Boot backend, and the React PWA — each with its own
# toolchain. Running all three on every pull request would make a README typo
# wait for Testcontainers, so each one runs only when its own sources changed.
#
# Because the jobs are conditional, they cannot be required branch-protection
# checks directly: a skipped job reports no useful result. The `PR validation`
# job at the bottom always runs and aggregates the others, so branch protection
# has a single stable check to require.
name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR makes the previous run obsolete.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the merge base with the target branch is present.
          fetch-depth: 0

      - name: Classify the changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu

          # Three-dot: what this branch changed since it diverged, ignoring
          # commits that landed on main in the meantime.
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # A change to this workflow re-validates everything, so a broken
          # filter cannot quietly disable a job.
          self='^\.github/workflows/pr-validation\.yml$'

          # The documentation build reads the vendored toolchain and the agent
          # contracts too, not just docs/ — a change to either can break
          # validation or leave the generated adapters stale.
          docs='^(docs/|metamodel/|templates/|scripts/|adapters/|build\.sh$|AGENTS\.md$|general-semantic-contracts\.md$)'
          backend='^application/backend/'
          web='^application/web/'

          classify() {
            if echo "$changed" | grep -qE "$2" || echo "$changed" | grep -qE "$self"; then
              echo "$1=true" >>"$GITHUB_OUTPUT"
              echo "-> $1: run"
            else
              echo "$1=false" >>"$GITHUB_OUTPUT"
              echo "-> $1: skip"
            fi
          }

          classify docs "$docs"
          classify backend "$backend"
          classify web "$web"

  docs:
    name: Architecture documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `all` = fail on stale agent adapters, then validate the metamodel and
      # relations and render the arc42 HTML. Same pinned docs-toolbox image as a
      # local run, so a green PR here means the Pages deployment will render.
      - name: Validate and render the documentation
        run: ./build.sh all

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Testcontainers starts PostgreSQL itself against the runner's Docker
      # daemon, so there is no service container to declare here.
      - name: Run tests
        run: ./gradlew test --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: application/backend/build/reports/tests/test
          retention-days: 7

  web:
    name: Web tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: application/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # `npm run build` is `tsc --noEmit && vite build`, so this type-checks the
      # PWA and proves the installable bundle still builds.
      - name: Build the PWA
        run: npm run build

  result:
    name: PR validation
    needs: [changes, docs, backend, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the validation jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -eu
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              # A skipped job means its sources were untouched — not a failure.
              success|skipped) ;;
              *)
                echo "A validation job reported '$result'."
                exit 1
                ;;
            esac
          done
          echo "All applicable validation jobs passed."
